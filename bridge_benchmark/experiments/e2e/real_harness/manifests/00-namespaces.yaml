# P3 real-harness namespaces. `payments` is a prod-tier namespace whose TRUE tier is `strict`.
# `cage-system` holds the tier registry (the SEPARATE data source the admission policy binds `s` from).
apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels: { app.kubernetes.io/part-of: cage-p3 }
---
apiVersion: v1
kind: Namespace
metadata:
  name: cage-system
  labels: { app.kubernetes.io/part-of: cage-p3 }
